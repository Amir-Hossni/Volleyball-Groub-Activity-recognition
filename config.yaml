Data: 
  # Dataset root
  DATA_ROOT: "/kaggle/input/datasets/ahmedmohamed365/volleyball"

  # Dataset paths
  PATHS:
    TRACKING_ANNOTATION_PATH:
      "volleyball_tracking_annotation/volleyball_tracking_annotation"
    VIDEOS_PATH:
      "volleyball_/videos"
    VIDEOS_SAMPLE_PATH:
      "videos_sample/videos_sample"
    DETECTIONS_PATH:
      "volleyball-detections/volleyball-detections"
    PKL_PATH: "/kaggle/input/datasets/amirhossni/annot-dataset/annot_all.pkl"
      

  # Labels
  CATEGORIES:

    # Player action classification
    PLAYER_TO_IDX:
      blocking: 0
      digging: 1
      falling: 2
      jumping: 3
      moving: 4
      setting: 5
      spiking: 6
      standing: 7
      waiting: 8

    # Group activity classification
    SCENE_TO_IDX:
      "l_pass": 0
      "r_pass": 1
      "l_spike": 2
      "r_spike": 3
      "l_set": 4
      "r_set": 5
      "l_winpoint": 6
      "r_winpoint": 7

      "l-pass": 0
      "r-pass": 1
      "l-spike": 2
      "r-spike": 3
      "l-set": 4
      "r-set": 5
      "l-winpoint": 6
      "r-winpoint": 7


  # Dataset split from paper
  SPLIT:
    TRAIN_IDS:
      - "1"
      - "3"
      - "6"
      - "7"
      - "10"
      - "13"
      - "15"
      - "16"
      - "18"
      - "22"
      - "23"
      - "31"
      - "32"
      - "36"
      - "38"
      - "39"
      - "40"
      - "41"
      - "42"
      - "48"
      - "50"
      - "52"
      - "53"
      - "54"

    VAL_IDS:
      - "0"
      - "2"
      - "8"
      - "12"
      - "17"
      - "19"
      - "24"
      - "26"
      - "27"
      - "28"
      - "30"
      - "33"
      - "46"
      - "49"
      - "51"


# ─────────────────────────────────────────────────────────────────────────────
# Training hyper-parameters
# ─────────────────────────────────────────────────────────────────────────────
Training:

  # ── General optimizer (used by B1, B3-S2, B4, B5-S1, B5-S2, B6) ──────────
  OPTIMIZER:
    type: "AdamW"
    lr: 1.0e-4
    weight_decay: 1.0e-4

  # ── General scheduler (shared by trainers that receive scheduler=) ─────────
  SCHEDULER:
    type: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.1
    patience: 4
    min_lr: 1.0e-6

  # ── B3 Stage-A (person model, fresh ImageNet init) ─────────────────────────
  B3_STAGE_A:
    OPTIMIZER:
      type: "AdamW"
      lr: 1.0e-4
      weight_decay: 0.0

  # ── B7 Phase 1: Linear Probe (group head only, person frozen) ─────────────
  B7_PROBE:
    OPTIMIZER:
      type: "AdamW"
      lr: 4.0e-4
      weight_decay: 1.0e-4

  # ── B7 Phase 2: Joint Fine-tune ───────────────────────────────────────────
  B7_FINETUNE:
    # Low LR for person-level params (LSTM1 + player_proj)
    LR_PERSON: 3.0e-5
    WEIGHT_DECAY_PERSON: 1.0e-4
    # Higher LR for group-level params
    LR_GROUP: 3.0e-4
    WEIGHT_DECAY_GROUP: 1.0e-4

    SCHEDULER:
      type: "CosineAnnealingLR"
      T_max: 50
      eta_min: 1.0e-6